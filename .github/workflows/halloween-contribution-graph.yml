name: Generate Halloween Contribution Graph

on:
  schedule:
    - cron: '0 2 * * *'   # every day at 02:00 UTC
  workflow_dispatch:       # allow manual runs from the Actions tab

permissions:
  contents: write

# Prevent two runs from pushing at the same time.
concurrency:
  group: halloween-graph
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip -r requirements.txt

      - name: Render Halloween graph
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
        run: python scripts/generate_halloween_graph.py --username "$USERNAME" --token "$GITHUB_TOKEN" --out halloween-contribution-graph.svg

      - name: Commit updated SVG
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          BRANCH="${GITHUB_REF_NAME:-main}"
          # Keep the freshly generated graph safe across history resets.
          cp halloween-contribution-graph.svg /tmp/halloween-generated.svg

          # Retry: another push may land between our fetch and push.
          for attempt in 1 2 3 4 5; do
            git fetch --prune origin "$BRANCH"
            git reset --hard "origin/$BRANCH"
            cp /tmp/halloween-generated.svg halloween-contribution-graph.svg
            git add halloween-contribution-graph.svg

            if git diff --staged --quiet; then
              echo "No changes to commit."
              exit 0
            fi

            git commit -m "chore: update Halloween contribution graph"

            if git push origin "HEAD:$BRANCH"; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi

            echo "Push attempt $attempt rejected; retrying..."
            sleep 3
          done

          echo "Failed to push after 5 attempts." >&2
          exit 1
